<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathfind — algorithm visualizer</title>
  <style>
    :root {
      --bg: #0f1116;
      --border: #262b36;
      --text: #eceef3;
      --muted: #6c7384;
      --accent: #4da3ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      color: var(--muted);
      font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    }
    header { font-size: 16px; letter-spacing: 0.5px; }
    header .name { color: var(--text); }
    header .find { color: var(--accent); }
    header .tag  { color: var(--muted); font-size: 12px; margin-left: 10px; }
    canvas {
      display: block;
      /* The framebuffer is a fixed size. Let the browser smooth-scale it down on
         narrow viewports, nearest-neighbor would shred the grid hairlines. */
      max-width: 96vw;
      height: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    #status { padding: 1em; }
    footer { font-size: 12px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header><span class="name">path</span><span class="find">find</span>
    <span class="tag">six search algorithms, one interface</span></header>
  <div id="status">Loading…</div>
  <!-- Right-click places endpoints, so the context menu must stay suppressed. -->
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <footer><a href="https://github.com/samad-zeeshan/pathfind">source on GitHub</a></footer>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function () {
        document.getElementById('status').style.display = 'none';
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
