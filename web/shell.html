<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathfind</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #16161c;
      color: #a0a0aa;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      border: 1px solid #2a2a32;
      /* raylib renders at a fixed size, never let the browser stretch it */
      image-rendering: pixelated;
    }
    #status { padding: 1em; }
    footer { padding: 0.75em; font-size: 0.85em; }
    a { color: #7aa2f7; }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <!-- Right-click places endpoints, so the context menu must stay suppressed. -->
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <footer><a href="https://github.com/samad-zeeshan/pathfind">source on GitHub</a></footer>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function () {
        document.getElementById('status').style.display = 'none';
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
